name: EcoOfertasBot-AutoScrape
on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          AMAZON_ID: ${{ secrets.AMAZON_ID }}
          ALIEXPRESS_ID: ${{ secrets.ALIEXPRESS_ID }}
          GENERIC_ID: ${{ secrets.GENERIC_ID }}
        run: python src/main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "EcoOfertasBot"
          git config --global user.email "bot@ecoofertas.com"
          git add data/ofertas.json index.html
          git commit -m "Update offers: $(date)" || echo "No changes to commit"
          git push
